<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Primary Meta Tags -->
    <title>SalonApp — Book Salon Appointments</title>
    <meta
      name="description"
      content="SalonApp is your all-in-one solution for finding stylists, booking salon appointments, and managing your beauty routine."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SalonApp — Book Salon Appointments" />
    <meta
      property="og:description"
      content="Discover stylists near you, book in seconds, and get reminders—all in one app."
    />
    <!-- Replace “promo-og-image.png” with your actual Open Graph image in public/ -->
    <meta property="og:image" content="%PUBLIC_URL%/promo-og-image.png" />
    <meta property="og:url" content="https://yourdomain.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SalonApp — Book Salon Appointments" />
    <meta
      name="twitter:description"
      content="Discover stylists near you, book in seconds, and get reminders—all in one app."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/promo-og-image.png" />

    <!-- Google Fonts: Poppins (headings) + Inter (body) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Optional: manifest.json if you want PWA support -->
    <!-- <link rel="manifest" href="%PUBLIC_URL%/manifest.json" /> -->

    <!-- You can add any additional <meta> or <link> tags here -->
  </head>
  <body>
    <!-- This message appears if JavaScript is disabled -->
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- The root div where React will mount your application -->
    <div id="root"></div>

    <!--
      If you include an analytics script or any other third-party script, insert them here,
      right before the closing </body> tag. For example, Google Analytics:
    -->
    <!--
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-XXXXXXXXX-X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "UA-XXXXXXXXX-X");
    </script>
    -->
  </body>
</html>
